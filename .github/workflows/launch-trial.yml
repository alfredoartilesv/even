# TEMPORARY: reproduces the v0.1.2 launch failure on the hosted emulator and keeps the full logcat.
# Runs only on pushes to fix/release-launch; never tags or publishes. Removed before the PR merges.
name: Launch trial

on:
  push:
    branches: [fix/release-launch]

permissions:
  contents: read

jobs:
  build:
    name: Signed release APK (Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keystore from secrets (files in the runner's temp folder, removed after the build)
        env:
          HEALTH_KEYSTORE_BASE64: ${{ secrets.HEALTH_KEYSTORE_BASE64 }}
          HEALTH_KEYSTORE_PASSWORD: ${{ secrets.HEALTH_KEYSTORE_PASSWORD }}
          HEALTH_KEY_ALIAS: ${{ secrets.HEALTH_KEY_ALIAS }}
          HEALTH_KEY_PASSWORD: ${{ secrets.HEALTH_KEY_PASSWORD }}
        run: |
          test -n "$HEALTH_KEYSTORE_BASE64" || { echo "::error::The HEALTH_KEYSTORE_BASE64 secret is not set"; exit 1; }
          echo "$HEALTH_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          printf 'HEALTH_KEYSTORE_PASSWORD=%s\nHEALTH_KEY_ALIAS=%s\nHEALTH_KEY_PASSWORD=%s\n' "$HEALTH_KEYSTORE_PASSWORD" "$HEALTH_KEY_ALIAS" "$HEALTH_KEY_PASSWORD" > "$RUNNER_TEMP/release.env"
      - uses: docker/setup-buildx-action@v3
      - name: docker build --target release-apk (runs scripts/release-check.mjs inside)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: release-apk
          push: false
          outputs: type=local,dest=out
          secret-files: |
            keystore=${{ runner.temp }}/release.jks
            keystore_env=${{ runner.temp }}/release.env
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Remove the keystore files
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/release.env"
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: out/app-release.apk
          retention-days: 30

  emulator:
    name: Install and launch on an emulator
    runs-on: ubuntu-latest
    needs: build
    # A stuck emulator must not hold the release for the runner's 6 h default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: app-release-apk
          path: out
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # API 34: the API 35 image never came up on the hosted runner (adb found no device for the
      # whole wait, first release run, 27 Oct 2026). The app's min SDK is 24, so 34 still checks it.
      - name: Release check on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: node scripts/release-check.mjs --apk out/app-release.apk --device --build-tools "$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)" --out out/shots; s=$?; adb logcat -d -v time > out/shots/logcat.txt; adb logcat -d -b crash > out/shots/crash.txt; exit $s
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-launch-screenshot
          path: out/shots
          retention-days: 30

