# Public repo: nothing private gets in. On every PR and every push to develop or master, runs
# scripts/public-check.mjs: licence, no private files tracked, GitHub noreply commit emails, and
# gitleaks (.gitleaks.toml) over the PR's commits or the whole history. Takes seconds.
# The same check runs before a push (.githooks/pre-push, `npm run hooks`).
name: Secrets

on:
  pull_request:
  push:
    branches: [develop, master]

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.21.2
  # sha256 of gitleaks_8.21.2_linux_x64.tar.gz from the release's checksums.txt
  GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba

jobs:
  public-check:
    name: Nothing private (licence, files, emails, gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned, checksum verified)
        run: |
          curl -sSfL -o gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gl.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks" && tar -xzf gl.tgz -C "$RUNNER_TEMP/gitleaks" gitleaks && rm gl.tgz
          echo "GITLEAKS=$RUNNER_TEMP/gitleaks/gitleaks" >> "$GITHUB_ENV"
      - name: npm run public:check (a PR checks its own commits; a push checks all history)
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$BASE" ]; then node scripts/public-check.mjs --range "$BASE..$HEAD"; else node scripts/public-check.mjs; fi
