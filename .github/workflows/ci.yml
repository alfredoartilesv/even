# The same Docker build as `npm run docker:test` and `npm run docker:apk` on the PC.
name: CI

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master]

permissions:
  contents: read

jobs:
  test:
    name: Typecheck and tests (Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: docker build --target test
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  apk:
    name: Debug APK (Docker)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: docker build --target apk --output out
        uses: docker/build-push-action@v6
        with:
          context: .
          target: apk
          push: false
          outputs: type=local,dest=out
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: out/app-debug.apk
          retention-days: 14
