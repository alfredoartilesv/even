# Pull requests: typecheck and every test, in the same Docker build as `npm run docker:test`.
# No APK here: releases are built, checked and published by release.yml when develop is merged to master.
name: CI

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  test:
    name: Typecheck and tests (Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: docker build --target test
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
