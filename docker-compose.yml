# The phase 2 environment on this PC (docs/dev-setup.md section 4b). Later the same pieces run free
# on Vercel: `web` is the static build, `sync` is the function in api/, `db` is Neon Postgres.
#
#   npm run docker:up                                   build and start db, sync and web; waits until healthy
#   docker compose run --rm sync npm run test:sync      end-to-end sync check against these containers
#   npm run docker:down                                 stop (the database volume stays; add -v to wipe it)
#
# Ports listen on 127.0.0.1 only. The database password is for this local container only: the real
# one (Neon) lives in Vercel's environment settings, never here.
name: even

services:
  db:
    # Postgres 17.11, as on Neon's free plan (17). Pinned by digest (tests/docker.test.ts).
    image: postgres:17.11-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    environment:
      POSTGRES_DB: even
      POSTGRES_USER: even
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-even-local}
    ports: ["127.0.0.1:5432:5432"]
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U even -d even"]
      interval: 2s
      timeout: 3s
      retries: 30

  # The one container for phone sync: the API the phones push to and pull from.
  sync:
    build: { context: ., target: sync }
    environment:
      DATABASE_URL: postgres://even:${POSTGRES_PASSWORD:-even-local}@db:5432/even
      SERVER_SECRET: ${SERVER_SECRET:-even-local-only}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      # For docker compose run --rm sync npm run test:sync: the running service, by its compose name.
      SYNC_URL: http://sync:8787
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports: ["127.0.0.1:8787:8787"]
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8787/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build: { context: ., target: web }
    ports: ["127.0.0.1:4173:4173"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4173/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  db-data:
